{% extends 'layout.html' %}

{% block title %}Edit Product | SMK Mobiles{% endblock %}

{% block content %}
<section class="page-hero">
  <div class="container">
    <p class="eyebrow">Admin Panel</p>
    <h1>Edit Product</h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="glass-card admin-form-card">
      <form method="post" enctype="multipart/form-data" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" value="{{ product.name }}" required />
        </div>
        <div class="form-group">
          <label for="brand">Brand</label>
          <input id="brand" name="brand" value="{{ product.brand }}" required />
        </div>
        <div class="form-group">
          <label for="price">Price</label>
          <input id="price" name="price" type="number" value="{{ product.price }}" required />
        </div>
        <div class="form-group">
          <label for="offer_price">Offer Price</label>
          <input id="offer_price" name="offer_price" type="number" value="{{ product.offer_price }}" required />
        </div>
        <div class="form-group">
          <label for="availability">Availability</label>
          <input id="availability" name="availability" value="{{ product.availability }}" />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <input id="category" name="category" value="{{ product.category }}" />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4">{{ product.description }}</textarea>
        </div>
        <div class="form-group">
          <label for="image">Upload New Image</label>
          <input id="image" name="image" type="file" />
        </div>
        <div class="form-group">
          <label for="image_url">Image URL</label>
          <input id="image_url" name="image_url" value="{{ product.image }}" />
        </div>
        <button type="submit" class="btn btn-primary">Update Product</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
